  <text x="72" y="220" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="21">Desenvolvimento de Sistemas</text>
  <text x="72" y="253" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="14">aprendendo • construindo • evoluindo</text>
