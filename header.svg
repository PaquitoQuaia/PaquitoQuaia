<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PaquitoQuaia — Desenvolvimento de Sistemas</title>
  <desc id="desc">Banner escuro com linhas de grade, detalhes em azul e violeta e uma estética de terminal.</desc>
  <defs>
